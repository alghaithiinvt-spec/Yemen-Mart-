<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>سوق يمن مارت</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#1c1b1b;--o:#ff7a22;--oa:#c4510a;--bg:#f6f5f3;--t:#1c1b1b;--m:#6e6a66;--b:#e6e2dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--t);padding-bottom:84px}
.ic{flex:none;vertical-align:middle}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--p)}
.brand img{height:38px;width:auto;display:block}
.brand span{font-weight:700;font-size:17px}
.ubtn{background:#fff;border:1px solid var(--b);color:var(--p);border-radius:22px;padding:7px 14px;font:inherit;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.ubtn img{width:24px;height:24px;border-radius:50%}
main{padding:14px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--m);font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav a.on{color:var(--oa);font-weight:700}
nav a.add{color:var(--p);font-weight:500}
nav a.add i{background:var(--o);color:#fff;width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 12px rgba(255,122,34,.45);border:3px solid #fff}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--b);border-radius:12px;background:#fff;margin-bottom:10px;color:var(--t)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--o);border-color:var(--o)}
textarea{min-height:90px}
label{font-size:13px;color:var(--m);display:block;margin-bottom:4px}
.srch{position:relative}
.srch .ic{position:absolute;right:13px;top:13px;color:var(--m)}
.srch input{padding-right:42px}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;width:100%;font-size:15px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.o{background:var(--o);color:var(--p)}
.btn.l{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn.r{background:#fff;color:#b42318;border:1px solid #b42318}
.btn:disabled{opacity:.6}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:#fff;border:1px solid var(--b);border-radius:22px;padding:7px 14px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--t)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--b);position:relative;display:block;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(28,27,27,.05)}
.card .im{aspect-ratio:4/3;background:#ece9e5 center/cover}
.card .im.ph{display:flex;align-items:center;justify-content:center;color:#b3aca5}
.card .bd{padding:9px 11px 11px}
.card h3{font-size:14px;margin:0 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;line-height:1.35}
.pr{color:var(--oa);font-weight:700;font-size:15px}
.mt{color:var(--m);font-size:12px;margin-top:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.it{display:inline-flex;align-items:center;gap:4px}
.tag{position:absolute;top:8px;right:8px;background:var(--p);color:#fff;font-size:11px;padding:4px 9px;border-radius:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.tag .ic{color:var(--o)}
.fav{position:absolute;top:7px;left:7px;background:rgba(255,255,255,.95);border:0;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--p)}
.fav.on{color:var(--o)}
.box{background:#fff;border:1px solid var(--b);border-radius:14px;padding:15px;margin-bottom:12px}
.gal{display:flex;overflow-x:auto;gap:6px;scroll-snap-type:x mandatory;border-radius:14px;margin-bottom:12px}
.gal img{height:260px;max-width:92%;object-fit:cover;border-radius:14px;scroll-snap-align:center;flex:none}
.big{font-size:25px;font-weight:700;color:var(--p)}
.auc{background:#fff6ee;border:1px solid #ffd9bd}
.auc .big{color:var(--oa)}
.bid{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--b);font-size:14px;color:var(--t)}
.win{display:flex;align-items:center;gap:8px;font-weight:700}
.win .ic{color:var(--oa)}
.empty{text-align:center;color:var(--m);padding:44px 10px}
.empty .ic{color:#b3aca5;margin-bottom:8px}
.empty p{margin:0 0 6px}
.seg{display:flex;background:#e9e6e1;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px;font:inherit;border-radius:10px;font-weight:700;color:var(--m);display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on .ic{color:var(--o)}
.thumbs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.thumbs div{width:74px;height:74px;border-radius:10px;background:center/cover;position:relative}
.thumbs button{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #c9c2ba;border-radius:12px;padding:14px;margin-bottom:12px;color:var(--p);font-size:14px;font-weight:500;background:#faf9f7}
.pick .ic{color:var(--oa)}
#f_img{display:none}
.h3{display:flex;align-items:center;gap:8px;font-size:16px;margin:16px 0 10px}
.lnk{background:none;border:0;color:var(--m);font:inherit;font-size:13px;display:flex;align-items:center;gap:6px;margin:14px auto 0;padding:8px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:17px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--b);border-radius:12px;margin-bottom:8px;font-size:14px;color:var(--t)}
.opt input{width:auto;margin:0;accent-color:var(--o)}
.opt.on{border-color:var(--o);background:#fff6ee}
.h3 .ic{color:var(--oa)}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:11px 20px;border-radius:22px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
#toast.s{opacity:1}
.warn{background:#fff6ee;border:1px solid #ffd9bd;padding:16px;border-radius:14px;line-height:1.9}
.warn b{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.warn .ic{color:var(--oa)}
</style>
</head>
<body>
<header>
  <a class="brand" href="#/"><img src="logo.png" alt="YM"><span>سوق يمن مارت</span></a>
  <button class="ubtn" id="ubtn" onclick="authBtn()"></button>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,getDoc,updateDoc,deleteDoc,query,orderBy,limit,onSnapshot,runTransaction,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {getMessaging,getToken,onMessage,isSupported} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js";

/* ====== ضع إعدادات Firebase الخاصة بك هنا ====== */
const firebaseConfig={
  apiKey:"AIzaSyAn5qA1raLAvm3-h06UCicrHOG6lGHZ6KQ",
  authDomain:"yemen-mart-1bfac.firebaseapp.com",
  projectId:"yemen-mart-1bfac",
  appId:"1:702751338926:web:2ba0cabd27a6c986e9d83f",
  messagingSenderId:"702751338926"
};
/* =============================================== */

/* ---------- Icons (SVG) ---------- */
const P={
home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h14V9"/><path d="M10 21v-6h4v6"/>',
gavel:'<rect x="9.500" y="5" width="9" height="6" rx="1.200" transform="rotate(45 14 8)"/><path d="M11.900 10.100 4 18"/><path d="M3 21h11"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
heart:'<path d="M12 20.500S3 15.200 3 9a4.800 4.800 0 0 1 9-2.300A4.800 4.800 0 0 1 21 9c0 6.200-9 11.500-9 11.500z"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.200 3.600-7 8-7s8 2.800 8 7"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/>',
pin:'<path d="M12 21s-7-6.200-7-11.500a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
call:'<path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
chat:'<path d="M21 11.500a8.500 8.500 0 0 1-12.500 7.500L3 20.500l1.500-5A8.500 8.500 0 1 1 21 11.500z"/>',
check:'<path d="m5 12.500 4.500 4.500L19 7.500"/>',
trash:'<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4"/><path d="M12 13v4M8 21h8M10 17h4"/>',
camera:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13.500" r="3.800"/>',
x:'<path d="M6 6l12 12M18 6 6 18"/>',
flag:'<path d="M5 21V4"/><path d="M5 4h12l-2.500 4 2.500 4H5"/>',
tag:'<path d="M12.600 2.600A2 2 0 0 0 11.200 2H4a2 2 0 0 0-2 2v7.200a2 2 0 0 0 .6 1.400l8.700 8.700a2.400 2.400 0 0 0 3.400 0l6.600-6.600a2.400 2.400 0 0 0 0-3.400z"/><circle cx="7.500" cy="7.500" r="1"/>',
car:'<path d="M5 17H3v-5l2.500-5.500h13L21 12v5h-2"/><path d="M8.500 17h7"/><circle cx="7" cy="17" r="1.800"/><circle cx="17" cy="17" r="1.800"/><path d="M3 12h18"/>',
building:'<path d="M4 21V4h10v17"/><path d="M14 9h6v12"/><path d="M2 21h20M8 8h2M8 12h2M8 16h2"/>',
device:'<rect x="7" y="2.500" width="10" height="19" rx="2"/><path d="M11 18.500h2"/>',
sofa:'<path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v5H3z"/><path d="M5 18v2M19 18v2"/>',
shirt:'<path d="M8 3 3 6l2 4 2-1v11h10V9l2 1 2-4-5-3a4 4 0 0 1-8 0z"/>',
briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/>',
wrench:'<path d="M14.700 6.300a1 1 0 0 0 0 1.400l1.600 1.600a1 1 0 0 0 1.400 0l3.770-3.770a6 6 0 0 1-7.940 7.940l-6.910 6.910a2.120 2.120 0 0 1-3-3l6.910-6.910a6 6 0 0 1 7.940-7.940l-3.760 3.760z"/>',
paw:'<circle cx="6" cy="10" r="1.800"/><circle cx="10" cy="5.500" r="1.800"/><circle cx="15" cy="5.500" r="1.800"/><circle cx="19" cy="10" r="1.800"/><path d="M12.500 11c-3 0-6 3-6 6 0 2 1.500 3 3 3 1.200 0 2-.5 3-.5s1.800.5 3 .5c1.500 0 3-1 3-3 0-3-3-6-6-6z"/>',
bell:'<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/>',
grid:'<rect x="4" y="4" width="6.500" height="6.500" rx="1.200"/><rect x="13.500" y="4" width="6.500" height="6.500" rx="1.200"/><rect x="4" y="13.500" width="6.500" height="6.500" rx="1.200"/><rect x="13.500" y="13.500" width="6.500" height="6.500" rx="1.200"/>'
};
const ic=(n,s=20,fill=false)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${fill?"currentColor":"none"}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||P.grid}</svg>`;

const CATS=["سيارات","عقارات","جوالات وإلكترونيات","أثاث ومنزل","ملابس وأزياء","وظائف","خدمات","حيوانات وطيور","أخرى"];
const CATICON={"سيارات":"car","عقارات":"building","جوالات وإلكترونيات":"device","أثاث ومنزل":"sofa","ملابس وأزياء":"shirt","وظائف":"briefcase","خدمات":"wrench","حيوانات وطيور":"paw","أخرى":"grid"};
const CITIES=["صنعاء","عدن","تعز","إب","الحديدة","حضرموت","ذمار","مأرب","حجة","المحويت","عمران","صعدة","البيضاء","لحج","أبين","شبوة","الجوف","ريمة","الضالع","المهرة","سقطرى"];
const CUR={YER:"ر.ي",USD:"$",SAR:"ر.س"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-US");
const money=(n,c)=>fmt(n)+" "+(CUR[c]||"");
const toast=m=>{const t=$("#toast");t.textContent=m;t.className="s";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",2600)};
const ago=ts=>{const m=Math.floor((Date.now()-ts)/60000);if(m<1)return"الآن";if(m<60)return"قبل "+m+" دقيقة";const h=Math.floor(m/60);if(h<24)return"قبل "+h+" ساعة";return"قبل "+Math.floor(h/24)+" يوم"};
const left=end=>{let s=Math.floor((end-Date.now())/1000);if(s<=0)return"انتهى";const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);return(d?d+"ي ":"")+(h||d?h+"س ":"")+m+"د"};
const img0=a=>(a.images&&a.images[0]&&a.images[0].startsWith("data:image/"))?a.images[0]:"";

/* ---------- Static UI ---------- */
$("#nav").innerHTML=[["#/","n1","home","الرئيسية"],["#/auctions","n2","gavel","المزادات"],["#/add","n3","plus","انشر"],["#/favs","n4","heart","المفضلة"],["#/mine","n5","user","حسابي"]]
  .map(([h,id,i,t])=>`<a href="${h}" id="${id}" ${id==="n3"?'class="add"':""}>${id==="n3"?`<i>${ic(i,24)}</i>`:ic(i,23)}<span>${t}</span></a>`).join("");
const setUserBtn=u=>{$("#ubtn").innerHTML=u?`${u.photoURL?`<img src="${esc(u.photoURL)}" alt="">`:ic("user",18)}<span>${esc((u.displayName||"حسابي").split(" ")[0])}</span>`:`${ic("user",18)}<span>دخول</span>`};
setUserBtn(null);

if(firebaseConfig.apiKey.startsWith("PUT_")){
  $("#app").innerHTML=`<div class="warn"><b>${ic("check",20)} الموقع جاهز</b>بقي خطوة واحدة: افتح ملف index.html وضع إعدادات Firebase الخاصة بك مكان PUT_YOUR... في أعلى كود الجافاسكربت.</div>`;
  throw new Error("Firebase config missing");
}

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const S={user:null,ads:[],favs:[],cat:"",city:"",q:"",unsubBids:null};
window.S=S;

/* ---------- Auth ---------- */
window.login=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code!=="auth/popup-closed-by-user")toast("تعذر تسجيل الدخول")}};
window.authBtn=()=>S.user?(confirm("تسجيل الخروج؟")&&signOut(auth)):login();
onAuthStateChanged(auth,async u=>{
  S.user=u;setUserBtn(u);
  S.favs=[];
  if(u){try{const d=await getDoc(doc(db,"users",u.uid));S.favs=(d.data()||{}).favs||[]}catch(e){}}
  if(u&&"Notification" in window&&Notification.permission==="granted")saveToken().catch(()=>{});
  render();
});

/* ---------- Notifications (FCM) ---------- */
const VAPID_KEY="BJ705bEHJJn47EDFDfAFqiYqWezFg0RtMzrQkcmKnvJjrh1ppA6lY8vD8vtuLeCTd2jVq0AblaqM4cnik6Y0FCM";
let _msg=null;
async function getMsg(){
  if(_msg)return _msg;
  if(!(await isSupported().catch(()=>false)))return null;
  _msg=getMessaging(app);
  onMessage(_msg,p=>{const n=p.notification||p.data||{};toast((n.title?n.title+": ":"")+(n.body||""))});
  return _msg;
}
async function saveToken(){
  if(!S.user||VAPID_KEY.startsWith("PUT_"))return false;
  const m=await getMsg();if(!m)return false;
  const reg=await navigator.serviceWorker.register("firebase-messaging-sw.js");
  await navigator.serviceWorker.ready;
  const token=await getToken(m,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
  if(!token)return false;
  await setDoc(doc(db,"users",S.user.uid),{fcmTokens:arrayUnion(token),notifOn:true},{merge:true});
  return true;
}
window.enableNotifs=async()=>{
  if(!S.user)return login();
  if(!("Notification" in window)||!("serviceWorker" in navigator))return toast("متصفحك لا يدعم الإشعارات. على الآيفون أضف التطبيق للشاشة الرئيسية أولاً");
  try{
    const p=await Notification.requestPermission();
    if(p!=="granted")return toast("لم يتم السماح بالإشعارات");
    const ok=await saveToken();
    toast(ok?"تم تفعيل الإشعارات":"تعذر التفعيل");
    render();
  }catch(e){toast("تعذر التفعيل: "+(e.code||e.message||""))}
};

/* ---------- Data ---------- */
onSnapshot(query(collection(db,"ads"),orderBy("createdAt","desc"),limit(200)),snap=>{
  S.ads=snap.docs.map(d=>({id:d.id,...d.data()}));
  const r=route()[0];
  if(r==="ad")liveDetail();
  else if(r!=="add"&&!(document.activeElement&&document.activeElement.id==="q"))render();
},e=>{$("#app").innerHTML='<div class="warn">تعذر قراءة البيانات. تأكد من إنشاء Firestore ونشر القواعد.</div>'});

/* ---------- Router ---------- */
const route=()=>{const h=location.hash.replace(/^#\/?/,"").split("/");return[h[0]||"home",h[1]]};
window.addEventListener("hashchange",render);
function setNav(r){["n1","n2","n3","n4","n5"].forEach(i=>$("#"+i).classList.remove("on"));const m={home:"n1",auctions:"n2",favs:"n4",mine:"n5"}[r];if(m)$("#"+m).classList.add("on")}
const empty=(icon,msg)=>`<div class="empty">${ic(icon,44)}<p>${msg}</p></div>`;
function render(){
  if(S.unsubBids){S.unsubBids();S.unsubBids=null}
  const [r,id]=route();setNav(r);
  if(r==="ad")return viewAd(id);
  if(r==="add")return viewAdd();
  if(r==="mine")return viewMine();
  const pub=a=>a.status!=="sold"&&a.status!=="hidden";
  if(r==="favs")return viewList(S.ads.filter(a=>S.favs.includes(a.id)&&a.status!=="hidden"),empty("heart","لا توجد إعلانات في المفضلة بعد"),false);
  if(r==="auctions")return viewList(S.ads.filter(a=>a.type==="auction"&&pub(a)),empty("gavel","لا توجد مزادات حالياً"),true);
  viewList(S.ads.filter(pub),empty("tag","لا توجد إعلانات بعد. كن أول من ينشر"),true);
}

/* ---------- List ---------- */
function card(a){
  const im=img0(a);const au=a.type==="auction";
  const price=au?(a.bidCount?a.currentBid:a.startPrice):a.price;
  const ended=au&&Date.now()>=a.endAt;
  const fav=S.favs.includes(a.id);
  return `<a class="card" href="#/ad/${a.id}">
    <div class="im ${im?"":"ph"}" style="${im?`background-image:url(${im})`:""}">${im?"":ic(CATICON[a.category]||"grid",38)}</div>
    ${a.status==="hidden"?`<span class="tag" style="background:#b42318">مخفي</span>`:au?`<span class="tag">${ic("clock",12)}${ended?"انتهى":left(a.endAt)}</span>`:""}
    <button class="fav ${fav?"on":""}" aria-label="المفضلة" onclick="event.preventDefault();event.stopPropagation();toggleFav('${a.id}')">${ic("heart",17,fav)}</button>
    <div class="bd"><h3>${esc(a.title)}</h3><div class="pr">${au?(a.bidCount?"":"يبدأ من ")+money(price,a.currency):(price?money(price,a.currency):"السعر عند التواصل")}</div>
    <div class="mt"><span class="it">${ic("pin",12)}${esc(a.city)}</span><span>${ago(a.createdAt)}</span></div></div></a>`;
}
function viewList(list,emptyHtml,filters){
  let h="";
  if(filters){
    h+=`<div class="srch">${ic("search",18)}<input id="q" placeholder="ابحث عن شيء..." value="${esc(S.q)}" oninput="S.q=this.value;fillList()"></div>
    <select onchange="S.city=this.value;refreshList()"><option value="">كل المدن</option>${CITIES.map(c=>`<option ${S.city===c?"selected":""}>${c}</option>`).join("")}</select>
    <div class="chips"><span class="chip ${!S.cat?"on":""}" onclick="S.cat='';refreshList()">${ic("grid",16)}الكل</span>${CATS.map(c=>`<span class="chip ${S.cat===c?"on":""}" onclick="S.cat='${c}';refreshList()">${ic(CATICON[c],16)}${c}</span>`).join("")}</div>`;
  }
  h+=`<div id="lst"></div>`;
  $("#app").innerHTML=h;
  window._cur={list,emptyHtml,filters};
  fillList();
}
function fillList(){
  const {list,emptyHtml,filters}=window._cur;
  let l=list;
  if(filters){
    const q=S.q.trim().toLowerCase();
    l=l.filter(a=>(!S.cat||a.category===S.cat)&&(!S.city||a.city===S.city)&&(!q||(a.title+" "+a.desc).toLowerCase().includes(q)));
  }
  $("#lst").innerHTML=l.length?`<div class="grid">${l.map(card).join("")}</div>`:emptyHtml;
}
window.fillList=fillList;
window.refreshList=()=>{const r=route()[0];if(r==="home"||r==="auctions")render()};
window.toggleFav=async id=>{
  if(!S.user)return login();
  const has=S.favs.includes(id);
  S.favs=has?S.favs.filter(x=>x!==id):[...S.favs,id];
  render();
  try{await setDoc(doc(db,"users",S.user.uid),{favs:has?arrayRemove(id):arrayUnion(id)},{merge:true})}catch(e){toast("تعذر الحفظ")}
};

/* ---------- Detail ---------- */
function waLink(p,t){let n=String(p).replace(/\D/g,"");if(n.startsWith("00"))n=n.slice(2);if(n.startsWith("967"));else{n=n.replace(/^0+/,"");n="967"+n}return"https://wa.me/"+n+"?text="+encodeURIComponent(t)}
function viewAd(id){
  const a=S.ads.find(x=>x.id===id);
  if(!a){$("#app").innerHTML='<div class="empty">جاري التحميل...</div>';return}
  const au=a.type==="auction";const mine=S.user&&S.user.uid===a.uid;
  if(a.status==="hidden"&&!mine){$("#app").innerHTML=empty("flag","هذا الإعلان غير متاح");return}
  const imgs=(a.images||[]).filter(i=>i.startsWith("data:image/"));
  let h=imgs.length?`<div class="gal">${imgs.map(i=>`<img src="${i}" alt="">`).join("")}</div>`:"";
  h+=`<div class="box ${au?"auc":""}"><h2 style="margin:0 0 8px;font-size:19px">${esc(a.title)}</h2>`;
  if(au){
    h+=`<div class="mt">السعر الحالي</div><div class="big" id="curP"></div>
    <div class="mt" id="meta"></div>`;
  }else h+=`<div class="big">${a.price?money(a.price,a.currency):"السعر عند التواصل"}</div>`;
  h+=`<div class="mt"><span class="it">${ic("pin",13)}${esc(a.city)}</span><span class="it">${ic(CATICON[a.category]||"grid",13)}${esc(a.category)}</span><span class="it">${ic("clock",13)}${ago(a.createdAt)}</span></div>
    <div class="mt"><span class="it">${ic("user",13)}${esc(a.userName)}</span></div>${a.status==="sold"?'<div class="tag" style="position:static;display:inline-flex;margin-top:8px;background:#555">تم البيع</div>':""}${a.status==="hidden"?'<div class="tag" style="position:static;display:inline-flex;margin-top:8px;background:#b42318">مخفي بواسطة الإدارة</div>':""}</div>`;
  if(au){
    h+=`<div class="box auc" id="bidBox"></div><div class="box"><b>آخر المزايدات</b><div id="bids" class="mt" style="display:block">جاري التحميل...</div></div>`;
  }
  h+=`<div class="box"><b>الوصف</b><p style="white-space:pre-wrap;line-height:1.8;margin:8px 0 0">${esc(a.desc)}</p></div>`;
  if(!mine){
    h+=`<div class="row"><a class="btn" href="${waLink(a.phone,"السلام عليكم، بخصوص إعلانك: "+a.title)}" target="_blank" rel="noopener">${ic("chat",19)}واتساب</a><a class="btn l" href="tel:${esc(String(a.phone).replace(/[^\d+]/g,""))}">${ic("call",19)}اتصال</a></div><button class="lnk" onclick="openReport('${a.id}')">${ic("flag",15)}الإبلاغ عن هذا الإعلان</button>`;
  }else{
    h+=`<div class="row">${a.status!=="sold"?`<button class="btn l" onclick="markSold('${a.id}')">${ic("check",19)}تم البيع</button>`:""}<button class="btn r" onclick="delAd('${a.id}')">${ic("trash",19)}حذف</button></div>`;
  }
  $("#app").innerHTML=h;
  if(au){liveDetail();watchBids(id)}
}
function liveDetail(){
  const id=route()[1];const a=S.ads.find(x=>x.id===id);
  if(!a||a.type!=="auction"){if(a&&!$("#curP")&&route()[0]==="ad")viewAd(id);return}
  if(!$("#curP")){viewAd(id);return}
  const ended=Date.now()>=a.endAt;
  $("#curP").textContent=money(a.bidCount?a.currentBid:a.startPrice,a.currency);
  $("#meta").innerHTML=`<span class="it">${ic("gavel",14)}${a.bidCount} مزايدة</span><span class="it">${ic("clock",14)}<b data-end="${a.endAt}">${left(a.endAt)}</b></span>`+(a.bidCount?`<span class="it">${ic("user",14)}الأعلى: ${esc(a.topBidderName)}</span>`:"");
  const box=$("#bidBox");const min=a.bidCount?a.currentBid+a.step:a.startPrice;
  if(ended){
    box.innerHTML=a.bidCount?`<div class="win">${ic("trophy",20)}انتهى المزاد. الفائز: ${esc(a.topBidderName)}</div><div class="mt">بمبلغ ${money(a.currentBid,a.currency)}. تواصل مع البائع لإتمام البيع.</div>`:`<b>انتهى المزاد بدون مزايدات</b>`;
  }else if(S.user&&S.user.uid===a.uid){
    box.innerHTML=`<div class="mt">هذا مزادك. لا يمكنك المزايدة عليه.</div>`;
  }else{
    const keep=$("#bidAmt");
    if(!keep){
      box.innerHTML=`<label>مبلغ مزايدتك (${CUR[a.currency]})</label><input id="bidAmt" type="number" inputmode="numeric" value="${min}"><div class="mt" id="minHint" style="margin:-4px 0 10px"></div><button class="btn o" onclick="placeBid('${a.id}')">${ic("gavel",19)}زايد الآن</button>`;
    }
    $("#minHint").textContent="أقل مبلغ: "+fmt(min)+" (الزيادة "+fmt(a.step)+")";
    if(Number($("#bidAmt").value)<min)$("#bidAmt").value=min;
  }
}
function watchBids(id){
  S.unsubBids=onSnapshot(query(collection(db,"ads",id,"bids"),orderBy("amount","desc"),limit(10)),s=>{
    const el=$("#bids");if(!el)return;
    const a=S.ads.find(x=>x.id===id)||{};
    el.innerHTML=s.empty?"لا توجد مزايدات بعد":s.docs.map(d=>{const b=d.data();return`<div class="bid"><span>${esc(b.name)}</span><b>${money(b.amount,a.currency)}</b></div>`}).join("");
  });
}
window.placeBid=async id=>{
  if(!S.user)return login();
  const amt=Math.floor(Number($("#bidAmt").value));
  if(!amt||amt<=0)return toast("أدخل مبلغاً صحيحاً");
  try{
    await runTransaction(db,async tx=>{
      const ref=doc(db,"ads",id);const s=await tx.get(ref);
      if(!s.exists())throw new Error("المزاد غير موجود");
      const a=s.data();
      if(a.uid===S.user.uid)throw new Error("لا يمكنك المزايدة على مزادك");
      if(Date.now()>=a.endAt)throw new Error("انتهى المزاد");
      const min=a.bidCount?a.currentBid+a.step:a.startPrice;
      if(amt<min)throw new Error("أقل مبلغ مسموح: "+fmt(min));
      const name=S.user.displayName||"مستخدم";
      tx.update(ref,{currentBid:amt,bidCount:a.bidCount+1,topBidderUid:S.user.uid,topBidderName:name});
      tx.set(doc(collection(ref,"bids")),{uid:S.user.uid,name,amount:amt,at:Date.now()});
    });
    toast("تمت المزايدة بنجاح");
  }catch(e){toast(e.message||"تعذرت المزايدة")}
};
window.markSold=async id=>{try{await updateDoc(doc(db,"ads",id),{status:"sold"});toast("تم التحديث");location.hash="#/mine"}catch(e){toast("تعذر التحديث")}};
window.delAd=async id=>{if(!confirm("حذف الإعلان نهائياً؟"))return;try{await deleteDoc(doc(db,"ads",id));toast("تم الحذف");location.hash="#/mine"}catch(e){toast("تعذر الحذف")}};

/* ---------- Report ---------- */
const REASONS=["احتيال أو نصب","إعلان مكرر","محتوى غير لائق","معلومات أو سعر خاطئ","تم بيعه ولم يُحدَّث","سبب آخر"];
let _rep={id:"",reason:""};
window.openReport=id=>{
  if(!S.user)return login();
  _rep={id,reason:""};
  const bg=document.createElement("div");bg.className="sheetbg";bg.id="sheetbg";
  bg.onclick=e=>{if(e.target===bg)closeSheet()};
  bg.innerHTML=`<div class="sheet"><h3>الإبلاغ عن الإعلان</h3>${REASONS.map((r,i)=>`<label class="opt" id="o${i}"><input type="radio" name="rr" onchange="pickReason(${i})">${r}</label>`).join("")}<textarea id="rnote" maxlength="300" placeholder="تفاصيل إضافية (اختياري)" style="min-height:70px;margin-top:4px"></textarea><div class="row"><button class="btn l" onclick="closeSheet()">إلغاء</button><button class="btn" onclick="sendReport()">إرسال البلاغ</button></div></div>`;
  document.body.appendChild(bg);
};
window.pickReason=i=>{_rep.reason=REASONS[i];REASONS.forEach((_,k)=>$("#o"+k).classList.toggle("on",k===i))};
window.closeSheet=()=>{const b=$("#sheetbg");if(b)b.remove()};
window.sendReport=async()=>{
  if(!_rep.reason)return toast("اختر سبب البلاغ");
  const a=S.ads.find(x=>x.id===_rep.id);if(!a)return;
  try{
    await setDoc(doc(db,"reports",_rep.id+"_"+S.user.uid),{adId:a.id,adTitle:a.title,adOwnerUid:a.uid,reason:_rep.reason,note:($("#rnote").value||"").trim().slice(0,300),uid:S.user.uid,userName:S.user.displayName||"مستخدم",createdAt:Date.now(),status:"open"});
    closeSheet();toast("وصلنا بلاغك، شكراً لك");
  }catch(e){closeSheet();toast(e.code==="permission-denied"?"سبق أن أبلغت عن هذا الإعلان":"تعذر إرسال البلاغ")}
};

/* ---------- Mine ---------- */
function viewMine(){
  if(!S.user){$("#app").innerHTML=`<div class="empty">${ic("user",44)}<p>سجّل الدخول لعرض إعلاناتك</p><br><button class="btn" onclick="login()">الدخول بحساب جوجل</button></div>`;return}
  const mine=S.ads.filter(a=>a.uid===S.user.uid);
  const bids=S.ads.filter(a=>a.type==="auction"&&a.topBidderUid===S.user.uid);
  const nb=("Notification" in window&&Notification.permission==="granted")?`<div class="box"><div class="win">${ic("check",20)}الإشعارات مفعّلة</div></div>`:`<div class="box"><b>الإشعارات</b><p class="mt" style="margin:6px 0 10px">فعّل الإشعارات لتصلك تنبيهات المزادات ورسائل الإدارة.</p><button class="btn o" onclick="enableNotifs()">${ic("bell",19)}تفعيل الإشعارات</button></div>`;
  let h=nb+`<div class="h3">${ic("tag",20)}إعلاناتي (${mine.length})</div>`+(mine.length?`<div class="grid">${mine.map(card).join("")}</div>`:empty("tag","لم تنشر شيئاً بعد"));
  if(bids.length)h+=`<div class="h3">${ic("gavel",20)}مزادات أنا الأعلى فيها (${bids.length})</div><div class="grid">${bids.map(card).join("")}</div>`;
  $("#app").innerHTML=h;
}

/* ---------- Add ---------- */
let draft={type:"ad",images:[]};
const thumbsHtml=()=>draft.images.map((i,k)=>`<div style="background-image:url(${i})"><button type="button" aria-label="حذف الصورة" onclick="rmImg(${k})">${ic("x",12)}</button></div>`).join("");
function viewAdd(){
  if(!S.user){$("#app").innerHTML=`<div class="empty">${ic("plus",44)}<p>سجّل الدخول لنشر إعلان</p><br><button class="btn" onclick="login()">الدخول بحساب جوجل</button></div>`;return}
  const au=draft.type==="auction";
  $("#app").innerHTML=`
  <div class="seg"><button class="${!au?"on":""}" onclick="setType('ad')">${ic("tag",18)}إعلان عادي</button><button class="${au?"on":""}" onclick="setType('auction')">${ic("gavel",18)}مزاد</button></div>
  <div class="box">
  <label>العنوان</label><input id="f_title" maxlength="100" placeholder="مثال: تويوتا كورولا 2015 نظيفة">
  <div class="row"><div><label>القسم</label><select id="f_cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div>
  <div><label>المدينة</label><select id="f_city">${CITIES.map(c=>`<option>${c}</option>`).join("")}</select></div></div>
  <div class="row"><div><label>${au?"سعر البداية":"السعر (اختياري)"}</label><input id="f_price" type="number" inputmode="numeric"></div>
  <div><label>العملة</label><select id="f_cur"><option value="YER">ريال يمني</option><option value="SAR">ريال سعودي</option><option value="USD">دولار</option></select></div></div>
  ${au?`<div class="row"><div><label>مدة المزاد</label><select id="f_dur"><option value="1">يوم</option><option value="3" selected>3 أيام</option><option value="7">7 أيام</option></select></div>
  <div><label>أقل زيادة</label><input id="f_step" type="number" inputmode="numeric" value="1000"></div></div>`:""}
  <label>رقم الجوال (واتساب)</label><input id="f_phone" type="tel" inputmode="tel" placeholder="7xxxxxxxx">
  <label>الوصف</label><textarea id="f_desc" maxlength="2000" placeholder="اكتب التفاصيل: الحالة، المواصفات..."></textarea>
  <label>الصور (حتى 3)</label><div class="thumbs" id="thumbs">${thumbsHtml()}</div>
  <label class="pick" for="f_img">${ic("camera",21)}إضافة صور</label>
  <input id="f_img" type="file" accept="image/*" multiple onchange="pickImgs(this)">
  <button class="btn" id="pub" onclick="publish()">نشر مجاناً</button></div>`;
}
window.setType=t=>{draft.type=t;viewAdd()};
window.rmImg=k=>{draft.images.splice(k,1);$("#thumbs").innerHTML=thumbsHtml()};
window.pickImgs=async inp=>{
  for(const f of [...inp.files]){
    if(draft.images.length>=3){toast("الحد الأقصى 3 صور");break}
    try{draft.images.push(await shrink(f))}catch(e){toast("تعذر قراءة صورة")}
  }
  inp.value="";
  $("#thumbs").innerHTML=thumbsHtml();
};
function shrink(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=()=>{
      const im=new Image();
      im.onerror=rej;
      im.onload=()=>{
        const M=800;let w=im.width,h=im.height;
        if(w>h&&w>M){h=h*M/w;w=M}else if(h>=w&&h>M){w=w*M/h;h=M}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(im,0,0,w,h);
        res(c.toDataURL("image/jpeg",.6));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
window.publish=async()=>{
  const v=id=>$("#"+id).value.trim();
  const title=v("f_title"),desc=v("f_desc"),phone=v("f_phone");
  const au=draft.type==="auction";
  if(title.length<3)return toast("اكتب عنواناً واضحاً");
  if(desc.length<5)return toast("اكتب وصفاً");
  if(phone.replace(/\D/g,"").length<7)return toast("أدخل رقم جوال صحيح");
  const price=Math.floor(Number(v("f_price"))||0);
  if(au&&price<=0)return toast("حدد سعر البداية");
  const data={type:draft.type,title,desc,phone,category:v("f_cat"),city:v("f_city"),currency:v("f_cur"),images:draft.images,
    uid:S.user.uid,userName:S.user.displayName||"مستخدم",createdAt:Date.now(),status:"active"};
  if(au){
    const step=Math.max(1,Math.floor(Number(v("f_step"))||1));
    Object.assign(data,{startPrice:price,currentBid:price,bidCount:0,step,endAt:Date.now()+Number(v("f_dur"))*86400000,topBidderUid:"",topBidderName:""});
  }else data.price=price;
  $("#pub").disabled=true;$("#pub").textContent="جاري النشر...";
  try{
    const ref=await addDoc(collection(db,"ads"),data);
    draft={type:"ad",images:[]};
    toast("تم النشر بنجاح");
    location.hash="#/ad/"+ref.id;
  }catch(e){toast("تعذر النشر، حاول مرة أخرى");$("#pub").disabled=false;$("#pub").textContent="نشر مجاناً"}
};

/* ---------- Live countdown ---------- */
setInterval(()=>{document.querySelectorAll("[data-end]").forEach(e=>e.textContent=left(Number(e.dataset.end)))},30000);
</script>
